<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>HI Procurement</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1d2329;--muted:#5f6b76;--line:#e2dfd7;
--red:#b42318;--red-bg:#fdf0ee;--yellow:#946200;--yellow-bg:#fdf6e3;--green:#2f7a4b;--green-bg:#edf7f0;--accent:#1f4e79}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:16px 16px 48px}
h1{font-size:28px;line-height:1.2;margin:0}h2{font-size:20px;margin:32px 0 12px}h3{font-size:19px;margin:4px 0 6px}
.sub,.muted,.stamp,.foot{color:var(--muted)}.stamp{font-size:14px;margin:4px 0 16px}.foot{font-size:14px;margin-top:32px}
#gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
#gate form{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px 22px;width:100%;max-width:380px}
#gate h1{font-size:24px;margin-bottom:6px}#gate p{color:var(--muted);margin:0 0 18px}
#gate input{width:100%;font-size:18px;padding:13px 14px;border:1px solid #c9c4b8;border-radius:10px;margin-bottom:12px}
#gate button{width:100%;font-size:18px;padding:13px;border:0;border-radius:10px;background:var(--accent);color:#fff;font-weight:600}
#err{color:var(--red);min-height:1.5em;margin-top:10px;font-size:15px}
.tabs{display:flex;gap:6px;background:#ebe8e0;border-radius:12px;padding:4px;margin-bottom:22px;position:sticky;top:8px;z-index:2}
.tabs button{flex:1;border:0;background:transparent;font-size:16px;padding:11px 8px;border-radius:9px;color:var(--muted);font-weight:600}
.tabs button[aria-selected=true]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.job[hidden]{display:none}
.pipe{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr;gap:0}
.step{position:relative;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;display:grid;grid-template-columns:5.2em 1fr;column-gap:12px;margin-bottom:18px}
.step:not(:last-child)::after{content:"";position:absolute;left:calc(16px + 2.6em);bottom:-18px;width:2px;height:18px;background:#c9c4b8}
.step-n{grid-row:span 2;font-size:28px;font-weight:700;align-self:center;color:var(--accent);font-variant-numeric:tabular-nums}
.step-zero .step-n{color:var(--muted)}.step-name{font-weight:650}.step-sub{font-size:14px;color:var(--muted)}
@media(min-width:760px){.pipe{grid-template-columns:repeat(6,1fr);gap:8px}.step{display:flex;flex-direction:column;margin:0;padding:12px}
.step:not(:last-child)::after{left:auto;right:-8px;top:50%;bottom:auto;width:8px;height:2px}.step-n{font-size:26px}}
.tally{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.t{padding:6px 12px;border-radius:999px;font-size:15px}
.t.red{background:var(--red-bg);color:var(--red)}.t.yellow{background:var(--yellow-bg);color:var(--yellow)}.t.green{background:var(--green-bg);color:var(--green)}
.cards{display:grid;grid-template-columns:1fr;gap:12px}@media(min-width:760px){.cards{grid-template-columns:1fr 1fr}}
.card{background:var(--card);border:1px solid var(--line);border-left:6px solid;border-radius:12px;padding:14px 16px}
.card.red{border-left-color:var(--red)}.card.yellow{border-left-color:#d9a21b}.card.green{border-left-color:var(--green)}
.card p{margin:0}.card-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:15px}
.card-po{font-weight:700;font-variant-numeric:tabular-nums}.card-total{color:var(--muted);margin-left:auto;font-variant-numeric:tabular-nums}
.pill{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:2px 9px;border-radius:999px}
.red .pill{background:var(--red-bg);color:var(--red)}.yellow .pill{background:var(--yellow-bg);color:var(--yellow)}.green .pill{background:var(--green-bg);color:var(--green)}
.also{margin:8px 0 0;padding-left:18px;font-size:15px;color:var(--muted)}
.exlist{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.ex{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;display:grid;gap:2px}
.ex.red{border-left:6px solid var(--red)}.ex.yellow{border-left:6px solid #d9a21b}
.ex-tag{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}.ex.red .ex-tag{color:var(--red)}.ex.yellow .ex-tag{color:var(--yellow)}
.ex-who{font-weight:650}
.callout{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--accent);border-radius:12px;padding:14px 16px;margin-top:18px}
.judge{margin-top:40px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px 18px 16px}
.tablewrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:10px 8px;border-top:1px solid var(--line);vertical-align:top}thead th{border-top:0;color:var(--muted);font-weight:600}
td{white-space:nowrap;font-variant-numeric:tabular-nums}td:last-child{font-weight:700;color:var(--green)}
tbody th{font-weight:600}tbody th small{display:block;font-weight:400;color:var(--muted);font-size:14px}
</style></head><body>

<script>
(function(){
const P=JSON.parse(document.getElementById('payload').textContent);
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open(pw){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(P.salt),iterations:P.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.iv)},key,b64(P.ct));
  return new TextDecoder().decode(pt);
}
function tabs(app){
  const btns=app.querySelectorAll('[data-tab]'),jobs=app.querySelectorAll('[data-job]');
  const show=id=>{btns.forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===id));jobs.forEach(j=>j.hidden=j.id!==id);};
  btns.forEach(b=>b.addEventListener('click',()=>{show(b.dataset.tab);window.scrollTo(0,0);}));
  show('job1');
}
document.getElementById('f').addEventListener('submit',async e=>{
  e.preventDefault();const err=document.getElementById('err');err.textContent='Opening...';
  try{const app=document.getElementById('app');app.innerHTML=await open(document.getElementById('pw').value.trim());
    document.getElementById('gate').remove();app.hidden=false;tabs(app);}
  catch(_){err.textContent='That password did not work.';}
});
})();
</script></body></html>
